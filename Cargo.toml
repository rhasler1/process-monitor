[package]
name    = "process-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
process-table = { version = "0.1.0", path = "./process-table" }
crossterm  = { version = "0.27.0", features = ["serde", "event-stream"] }
ratatui    = { version = "0.26.0", features = ["serde", "macros"]}
anyhow     = "1.0.97"
sysinfo    = "0.34.2"
chrono     = "0.4.43"
log        = "0.4.29"
env_logger = "0.11.9"
serde      = "1.0.228"
toml       = "1.1.2"
directories = "6.0.0"

[profile.release]
debug = true
